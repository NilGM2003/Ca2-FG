[project]
name = "lifu-gui"
version = "0.1.0"
description = "Tkinter GUI to configure and trigger LIFU sonication protocols on a Tektronix AFG1022"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
    "pyusb>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
lifu-gui = "lifu_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifu_gui"]
